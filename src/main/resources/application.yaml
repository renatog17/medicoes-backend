app:
  faturamento:
    habilitado: ${FATURAMENTO_HABILITADO:false}
    valor-m3: ${FATURAMENTO_VALOR_M3:}
  banco:
    habilitado: ${BANCO_HABILITADO:false}
    url: ${BANCO_URL:http://localhost:9090}
    token: ${BANCO_TOKEN:}
    timeout-ms: ${BANCO_TIMEOUT_MS:5000}
    sincronizacao-ms: ${BANCO_SINCRONIZACAO_MS:900000}

spring:
  application:
    name: medicoes-api
  datasource:
    url: jdbc:postgresql://localhost:5432/devdb
    username: devuser
    password: devpass123
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
